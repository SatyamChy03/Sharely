name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - name: Build APK
        working-directory: apps/sharely
        run: flutter build apk --release
      - name: Name APK after the tag
        run: >-
          mv apps/sharely/build/app/outputs/flutter-apk/app-release.apk
          sharely-${{ github.ref_name }}-android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: sharely-${{ github.ref_name }}-android.apk

  windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - name: Build Windows
        working-directory: apps/sharely
        run: flutter build windows --release
      - name: Zip the app folder
        shell: pwsh
        run: >-
          Compress-Archive
          -Path apps/sharely/build/windows/x64/runner/Release/*
          -DestinationPath sharely-${{ github.ref_name }}-windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: sharely-${{ github.ref_name }}-windows.zip

  linux:
    name: Build Linux app
    # The oldest supported Ubuntu, so the app also runs on newer systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev
      - run: dart pub get
      - name: Build Linux
        working-directory: apps/sharely
        run: flutter build linux --release
      - name: Package .deb and .tar.gz
        run: tool/package_linux.sh ${{ github.ref_name }} dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/

  publish:
    name: Publish GitHub Release
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    # Only this job may write, and only to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          merge-multiple: true
      # Lets anyone check a download against what this run built.
      - name: Write checksums
        run: sha256sum sharely-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            sharely-${{ github.ref_name }}-android.apk
            sharely-${{ github.ref_name }}-windows.zip
            sharely-${{ github.ref_name }}-linux-amd64.deb
            sharely-${{ github.ref_name }}-linux-x64.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          # Builds are debug-signed until release signing is set up.
          prerelease: true
