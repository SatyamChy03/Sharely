name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - name: Build APK
        working-directory: apps/sharely
        run: flutter build apk --release
      - name: Name APK after the tag
        run: >-
          mv apps/sharely/build/app/outputs/flutter-apk/app-release.apk
          sharely-${{ github.ref_name }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: sharely-${{ github.ref_name }}-android.apk

  windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - name: Build Windows
        working-directory: apps/sharely
        run: flutter build windows --release
      - name: Zip the app folder
        shell: pwsh
        run: >-
          Compress-Archive
          -Path apps/sharely/build/windows/x64/runner/Release/*
          -DestinationPath sharely-${{ github.ref_name }}-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: sharely-${{ github.ref_name }}-windows.zip

  publish:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    # Only this job may write, and only to create the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sharely-${{ github.ref_name }}-android.apk
            sharely-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
          # Builds are debug-signed until release signing is set up.
          prerelease: true
